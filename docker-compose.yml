version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: breach
      POSTGRES_PASSWORD: breachpw
      POSTGRES_DB: breachalert
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breach"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: .env
    depends_on: [redis, db]
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info

  beat:
    build: ./backend
    env_file: .env
    depends_on: [redis, db]
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]

volumes:
  pgdata: